version: 2

models:
  - name: stg_accounts
    description: "Cleaned and renamed accounts. One row per account (bank + account number)."
    columns:
      - name: account_key
        description: >
          Unique account key: bank_id|account_id. Account numbers are only unique within a bank;
          8 account numbers exist at two different banks with different owners.
        data_tests:
          - not_null
          - unique
      - name: account_id
        description: "Account number. Unique only within a bank."
        data_tests:
          - not_null
      - name: bank_id
        description: "ID of the bank holding the account, normalized without leading zeros."
        data_tests:
          - not_null
      - name: bank_name
        description: "Name of the bank."
        data_tests:
          - not_null
      - name: entity_id
        description: "ID of the account holder. One entity can own several accounts."
        data_tests:
          - not_null
      - name: entity_name
        description: "Name of the account holder, e.g. 'Corporation #33520'. Synthetic but treated as personal data."
        data_tests:
          - not_null
      - name: entity_type
        description: "Type of account holder extracted from entity_name, e.g. Corporation, Partnership."
        data_tests:
          - not_null