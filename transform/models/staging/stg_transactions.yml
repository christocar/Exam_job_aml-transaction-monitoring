version: 2

models:
  - name: stg_transactions
    description: >
      Typed and renamed transactions. One row per transaction from the raw source.
      No rows are removed. Exact duplicates are flagged, not dropped.
    columns:
      - name: transaction_id
        description: >
          Deterministic surrogate key: MD5 hash of all columns plus an occurrence number.
          Identical rows get suffixes -1, -2. Stable across rebuilds.
        data_tests:
          - not_null
          - unique
      - name: transaction_at
        description: "Date and time of the transaction. Source has no time zone, so stored as DATETIME."
        data_tests:
          - not_null
      - name: from_bank_id
        description: >
          ID of the sending bank, normalized without leading zeros (e.g. '010' -> '10')
          so it matches bank_id in stg_accounts. The raw layer keeps the original value.
        data_tests:
          - not_null
      - name: from_account_id
        description: "Account number of the sending account. Unique only within a bank."
        data_tests:
          - not_null
      - name: to_bank_id
        description: >
          ID of the receiving bank, normalized without leading zeros
          so it matches bank_id in stg_accounts.
        data_tests:
          - not_null
      - name: to_account_id
        description: "Account number of the receiving account. Unique only within a bank."
        data_tests:
          - not_null
      - name: amount_received
        description: "Amount received, in receiving_currency."
        data_tests:
          - not_null
      - name: receiving_currency
        description: "Currency of the received amount."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: &currencies
                  - US Dollar
                  - Euro
                  - Swiss Franc
                  - Yuan
                  - Shekel
                  - Rupee
                  - UK Pound
                  - Ruble
                  - Yen
                  - Bitcoin
                  - Canadian Dollar
                  - Australian Dollar
                  - Mexican Peso
                  - Saudi Riyal
                  - Brazil Real
      - name: amount_paid
        description: "Amount paid, in payment_currency."
        data_tests:
          - not_null
      - name: payment_currency
        description: "Currency of the paid amount."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: *currencies
      - name: payment_format
        description: "Payment method."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - Cheque
                  - Credit Card
                  - ACH
                  - Cash
                  - Reinvestment
                  - Wire
                  - Bitcoin
      - name: is_laundering
        description: "Label from the source: true if the transaction is part of money laundering."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false
      - name: from_account_key
        description: "Key of the sending account: from_bank_id|from_account_id. Joins to stg_accounts.account_key."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_accounts')
                field: account_key
      - name: to_account_key
        description: "Key of the receiving account: to_bank_id|to_account_id. Joins to stg_accounts.account_key."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_accounts')
                field: account_key
      - name: is_exact_duplicate
        description: >
          True if the row is identical to another row in every column.
          18 rows (9 pairs) in HI-Small, all small Bitcoin/ACH wallet transactions, none labelled as laundering.
        data_tests:
          - not_null